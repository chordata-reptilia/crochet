<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <title>Crochet Pattern Designer</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <button id="new-project-btn">Nouveau</button>
      <button id="open-project-btn">Ouvrir</button>
      <button id="save-project-btn">Enregistrer</button>
      <button id="export-png-btn">Exporter PNG</button>
      <button id="export-pdf-btn">Exporter PDF</button>
      <button id="tool-brush" class="tool-btn active" data-tool="brush">Pinceau</button>
      <button id="tool-bucket" class="tool-btn" data-tool="bucket">Seau</button>
      <button id="tool-eraser" class="tool-btn" data-tool="eraser">Gomme</button>
      <button id="tool-eyedropper" class="tool-btn" data-tool="eyedropper">Pipette</button>
      <span class="toolbar-sep"></span>
      <button id="undo-btn">Annuler</button>
      <button id="redo-btn">Rétablir</button>
      <button id="zoom-in">Zoom +</button>
      <button id="zoom-out">Zoom -</button>
    </header>
    <div id="main-row">
      <main id="workspace">
        <canvas id="grid-canvas"></canvas>
      </main>
      <aside id="side-panel">
        <section id="palette-panel">
          <h3>Couleurs</h3>
          <div id="color-list"></div>
          <input type="color" id="new-color-picker" value="#ff0000" />
          <input type="text" id="new-color-hex" placeholder="#RRGGBB" maxlength="7" />
          <button id="add-color-btn">Ajouter</button>
        </section>
        <section id="mode-panel">
          <h3>Mode</h3>
          <select id="mode-select">
            <option value="classic">Grille classique</option>
            <option value="c2c">Corner-to-Corner (C2C)</option>
          </select>
        </section>
        <section id="instructions-panel">
          <h3>Instructions</h3>
          <ol id="instructions-list"></ol>
        </section>
      </aside>
    </div>
  </div>

  <div id="new-project-modal" hidden>
    <div id="new-project-modal-box">
      <h3>Nouveau motif</h3>
      <label>Nom :<br /><input type="text" id="new-project-name" value="Nouveau motif" /></label><br />
      <label>Largeur (mailles) :<br /><input type="number" id="new-project-width" value="20" min="1" /></label><br />
      <label>Hauteur (mailles) :<br /><input type="number" id="new-project-height" value="20" min="1" /></label><br />
      <label>Mode :<br />
        <select id="new-project-mode">
          <option value="classic">Grille classique</option>
          <option value="c2c">Corner-to-Corner (C2C)</option>
        </select>
      </label><br />
      <button id="new-project-confirm">Créer</button>
      <button id="new-project-cancel">Annuler</button>
    </div>
  </div>

  <div id="pdf-export-modal" hidden>
    <div id="pdf-export-modal-box">
      <div class="pdf-export-modal-layout">
        <div class="pdf-export-modal-controls">
          <h3>Exporter en PDF</h3>
          <label>Orientation :<br />
            <div class="pdf-orientation-buttons">
              <button type="button" id="pdf-orientation-portrait" class="pdf-orientation-btn active" data-orientation="portrait">Portrait</button>
              <button type="button" id="pdf-orientation-landscape" class="pdf-orientation-btn" data-orientation="landscape">Paysage</button>
            </div>
          </label><br />
          <label>Format papier :<br />
            <select id="pdf-paper-size">
              <option value="A0">A0</option>
              <option value="A1">A1</option>
              <option value="A2">A2</option>
              <option value="A3">A3</option>
              <option value="A4" selected>A4</option>
              <option value="A5">A5</option>
              <option value="A6">A6</option>
              <option value="Legal">Legal</option>
              <option value="Ledger">Ledger</option>
              <option value="Letter">Letter</option>
            </select>
          </label><br />
          <label>Marge :<br />
            <div class="pdf-margin-row">
              <input type="number" id="pdf-margin-mm" value="10" min="0" />
              <select id="pdf-margin-unit">
                <option value="mm" selected>mm</option>
                <option value="cm">cm</option>
                <option value="in">in</option>
              </select>
            </div>
          </label><br />
          <label>Instructions :<br />
            <select id="pdf-instructions-position">
              <option value="before">Avant la grille</option>
              <option value="after" selected>Après la grille</option>
              <option value="none">Aucune</option>
            </select>
          </label><br />
          <label class="pdf-legend-checkbox-label">
            <input type="checkbox" id="pdf-include-legend" />
            Inclure la légende
          </label><br />
          <div class="pdf-legend-download-row">
            <button type="button" id="pdf-legend-download-btn">Télécharger la légende séparément…</button>
            <select id="pdf-legend-format">
              <option value="pdf" selected>PDF</option>
              <option value="png">PNG</option>
            </select>
          </div>
          <button id="pdf-export-confirm">Exporter</button>
          <button id="pdf-export-cancel">Annuler</button>
        </div>
        <div class="pdf-export-modal-preview">
          <div id="pdf-preview-error" class="pdf-preview-error" hidden></div>
          <iframe id="pdf-preview-frame" title="Aperçu du PDF"></iframe>
        </div>
      </div>
    </div>
  </div>

  <script src="../src/grid.js"></script>
  <script src="../src/palette.js"></script>
  <script src="../src/project.js"></script>
  <script src="../src/instructions.js"></script>
  <script src="../src/legend.js"></script>
  <script src="app.js"></script>
</body>
</html>
